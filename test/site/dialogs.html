<!doctype html>
<meta charset="utf-8">
<title>Dialogs</title>
<link rel="stylesheet" href="style.css">
<h1>Dialogs</h1>
<button id="alert">Show alert</button>
<button id="confirm">Show confirm</button>
<button id="prompt">Show prompt</button>
<label>First <input id="first"></label>
<label>Second <input id="second"></label>
<label>Third <input id="third"></label>
<div id="result" role="status" aria-label="Result"></div>
<script>
  const out = text => { document.getElementById('result').textContent = text; };
  document.getElementById('alert').onclick = () => { alert('Hello from alert'); out('alert:closed'); };
  document.getElementById('confirm').onclick = () => out('confirm:' + confirm('Proceed?'));
  // The first fill asks a confirm; afterwards Second stays disabled for 1.5 s, so the rest of the fill runs late.
  let asked = false;
  document.getElementById('first').addEventListener('input', () => {
    if (asked) return;
    asked = true;
    out('fill-confirm:' + confirm('Keep filling?'));
    const second = document.getElementById('second');
    second.disabled = true;
    setTimeout(() => { second.disabled = false; }, 1500);
  });
  document.getElementById('prompt').onclick = () => out('prompt:' + prompt('Your name?', 'default'));
</script>
