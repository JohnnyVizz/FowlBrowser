<!doctype html>
<meta charset="utf-8">
<title>Popup target</title>
<link rel="stylesheet" href="style.css">
<h1>Popup target</h1>
<div id="result" role="status" aria-label="Result"></div>
<script>
  document.getElementById('result').textContent = 'popup:' + new URLSearchParams(location.search).get('via');
  document.title = 'Popup target ' + new URLSearchParams(location.search).get('via');
</script>
