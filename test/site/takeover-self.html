<!doctype html>
<meta charset="utf-8">
<title>Navigates by itself</title>
<link rel="stylesheet" href="style.css">
<h1>Navigates by itself</h1>
<p>?do=reload reloads itself once; ?do=back goes to a second page, which calls history.back() once. Each after ?wait= ms (default 1500).</p>
<p id="result">waiting</p>
<script>
  const params = new URLSearchParams(location.search);
  const key = `fb-self:${location.search.replace(/&second=1$/, '')}`;
  const wait = Number(params.get('wait')) || 1500;
  const step = sessionStorage[key] ?? 'start';
  const result = document.getElementById('result');
  const later = (fn) => setTimeout(fn, wait);
  if (params.get('do') === 'reload') {
    if (step === 'start') { sessionStorage[key] = 'reloaded'; later(() => location.reload()); }
    else result.textContent = 'done';
  } else if (params.get('do') === 'back') {
    if (step === 'start') { sessionStorage[key] = 'second'; setTimeout(() => { location.href = `${location.href}&second=1`; }, 300); }
    else if (step === 'second') { sessionStorage[key] = 'back'; result.textContent = 'second page'; later(() => history.back()); }
    else result.textContent = 'done';
  }
</script>
